# 단계적 마이그레이션 계획(스펙 "단계적 마이그레이션 계획")이 사용하는 정적 참조
# 테이블. 목표: Spring Boot 4.1 / Spring Cloud 2025.1 / Java 21 / Spring AI 2.0.
#
# confidence: verified   -- 실제 존재/배포가 확인된 레시피 이름/좌표. 대부분
#                           OpenRewrite 공식(org.openrewrite.recipe:*)이지만,
#                           공식에 없는 경우 Maven Central에 공개 배포되고
#                           라이선스가 이 도구의 "공개 Maven Central + RELEASE"
#                           방식과 맞는(예: Apache 2.0) 서드파티 레시피도
#                           확인 후 포함한다(예: spring_ai_steps의 Arconia).
#             unverified -- 아직 공식 릴리스가 없어, 기존 명명 규칙을 그대로
#                           연장해 추정한 이름이다. 실제 릴리스가 나오면 이
#                           파일을 그 값으로 갱신해야 한다.
# recipe: null인 항목은 "레시피 없음 -> AI가 직접 코드 수정"으로 처리한다
#   (judgment call (i): 카탈로그 완성은 코딩 작업이 아니라 리서치 작업).

spring_boot_steps:
  - from: "2.7"
    to: "3.0"
    recipe: org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_0
    artifact: org.openrewrite.recipe:rewrite-spring:RELEASE
    confidence: verified
  - from: "3.0"
    to: "3.2"
    recipe: org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_2
    artifact: org.openrewrite.recipe:rewrite-spring:RELEASE
    confidence: verified
  - from: "3.2"
    to: "3.4"
    recipe: org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_4
    artifact: org.openrewrite.recipe:rewrite-spring:RELEASE
    confidence: verified
  - from: "3.4"
    to: "3.5"
    recipe: org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5
    artifact: org.openrewrite.recipe:rewrite-spring:RELEASE
    confidence: verified
  - from: "3.5"
    to: "4.0"
    recipe: org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0
    artifact: org.openrewrite.recipe:rewrite-spring:RELEASE
    confidence: verified # 2026-08-07 확인: rewrite-spring Community Edition에 실존, 3.5를 시작 조건으로 명시
      # (Spring Framework 7.0/Security 7.0/Cloud 2025.1/Batch 6.0까지 함께 처리).
      # https://docs.openrewrite.org/recipes/java/spring/boot4/upgradespringboot_4_0-community-edition
  # 4.0 -> 4.1은 의도적으로 항목이 없다 (2026-08-07 실측 + 웹 조사로 확인):
  # org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_1은 존재하지 않는다
  # (실제 job #7에서 `mvn rewrite:run`이 "Recipe(s) not found... Did you mean:
  # ...UpgradeSpringBoot_4_0"으로 실패). 완전한 버전은
  # io.moderne.java.spring.boot4.UpgradeSpringBoot_4_1로 존재하지만 Moderne
  # 유료 구독 전용(io.moderne.recipe:rewrite-spring, Moderne Proprietary
  # License) -- 지금 이 도구가 쓰는 "공개 Maven Central + RELEASE" 방식과
  # 안 맞는다. 무료 쪽엔 org.openrewrite.java.spring.boot4.SpringBootProperties_4_1
  # (org.openrewrite.recipe:rewrite-spring:6.36.1)가 있지만 이건 프로퍼티 키
  # 이름만 바꿔줄 뿐 Spring Boot 버전 자체는 안 올리고, 이마저도 Moderne
  # Source Available License라 사전 컴파일 아티팩트는 Moderne 고객 전용이다.
  # 항목을 비워두면 build_migration_plan(planning.py)이 4.0 -> 4.1을 AI가
  # 레시피 없이 직접 시도하는 스텝으로 계획에 넣는다(graph_stage1.py) --
  # 그것도 실패하면 needs_handoff로 인수인계 가이드를 만든다
  # (docs/architecture.md §7 참고).

java_steps:
  - to: "17"
    recipe: org.openrewrite.java.migrate.UpgradeToJava17
    artifact: org.openrewrite.recipe:rewrite-migrate-java:RELEASE
    confidence: verified
  - to: "21"
    recipe: org.openrewrite.java.migrate.UpgradeToJava21
    artifact: org.openrewrite.recipe:rewrite-migrate-java:RELEASE
    confidence: verified

# Spring Cloud 릴리스 트레인은 특정 Spring Boot 버전과 1:1로 고정 호환된다
# (스펙: "Spring Cloud는 독립적으로 버전을 정하지 않는다"). Boot 버전으로 조회.
spring_cloud_trains:
  "3.0": "2022.0"
  "3.1": "2022.0"
  "3.2": "2023.0"
  "3.3": "2023.0"
  "3.4": "2024.0"
  "3.5": "2024.0"
  "4.0": "2025.0"
  "4.1": "2025.1"

spring_ai_steps:
  - to: "2.0"
    recipe: io.arconia.rewrite.spring.ai2.UpgradeSpringAi_2_0
    artifact: io.arconia.migrations:rewrite-spring:RELEASE
    third_party: true # 공식 org.openrewrite.recipe:* 밖 -- 화면/로그의 스텝 설명에
      # "(서드파티 레시피)"로 표시된다(orchestration/planning.py). 아래 confidence
      # 주석에 어느 프로젝트/라이선스인지 근거를 남겨뒀다.
    confidence: verified # 2026-08-09 확인 (job #10 계기): 공식 org.openrewrite.recipe:rewrite-spring에는
      # Spring AI 레시피가 없다. 대신 Arconia Migrations(arconia-io/arconia-migrations,
      # Apache License 2.0)가 Spring AI 1.1.x -> 2.0.x 전체 마이그레이션 레시피를
      # 제공한다 -- 이 카탈로그 최초의 비공식(org.openrewrite.recipe 밖) 서드파티
      # 레시피 채택. 3중 확인: (1) GitHub 소스의 실제 레시피 YAML(rewrite-spring/
      # src/main/resources/META-INF/rewrite/spring/ai2/spring-ai-2-0.yml) 내용 확인 --
      # ChatOptions 빌더/툴콜링 리팩터링, ChatMemory advisor 이름 변경,
      # ModelOptionsUtils -> JsonHelper, Anthropic 공식 SDK 전환 등 실제 breaking
      # change를 폭넓게 커버하는 완전한 레시피. (2) Maven Central의
      # maven-metadata.xml(repo1.maven.org/maven2/io/arconia/migrations/
      # rewrite-spring/)로 배포 여부 + latest=release=1.1.0 확인. (3) 그 YAML이
      # git 태그 v1.1.0(실제 릴리스, main 브랜치 전용 아님)에도 존재함을 확인.
      # 호출 방식도 이 도구의 rewrite_client.py가 이미 쓰는
      # recipeArtifactCoordinates + activeRecipes 그대로 맞아 코드 변경 불필요.
      # (참고로 Spring AI 프로젝트 자체의 org.springframework.ai.migration.M3Migrate*
      # 레시피도 있지만, 2.0.0-M3 마일스톤 대상이고 MCP 관련 변경만 다루는 부분
      # 레시피이며 -Drewrite.configLocation=<GitHub raw YAML URL> 방식이라
      # recipeArtifactCoordinates만 지원하는 지금 구조와 안 맞아 채택하지 않음.)
